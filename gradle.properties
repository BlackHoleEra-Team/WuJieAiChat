org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 本地代理：dl.google.com 直连不可达，依赖下载走 127.0.0.1:7897。
# 代理没开时注释掉下面 6 行即可恢复直连。
# nonProxyHosts 必须排除本机回环，否则 Gradle daemon 的 loopback 通信会被代理拦截
# （报 "Unable to establish loopback connection"）。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1|[::1]
systemProp.https.nonProxyHosts=localhost|127.0.0.1|[::1]

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

kotlin.code.style=official
kotlin.incremental.compose=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
